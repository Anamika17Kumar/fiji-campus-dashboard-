<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiji Campus Bus & Weather Dashboard</title>

    <style>
        /* General page styling */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #87CEEB, #E0F7FA);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #00695C;
        }

        .card {
            background: #F5F5F5;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            background: #00796B;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #004D40;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .weather-box {
            background: #E3F2FD;
            border-left: 5px solid #2196F3;
            padding: 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Fiji Campus Bus & Weather Dashboard</h1>

    <!-- Bus Fare Calculator -->
    <div class="card">
        <h2>Bus Fare Calculator</h2>

        <label for="budget">Enter your bus fare budget (FJD):</label>

        <input
            type="number"
            id="budget"
            placeholder="Example: 15"
            min="0"
            step="0.01">

        <button onclick="calculateRides()">
            Calculate Rides
        </button>

        <div id="result"></div>
    </div>

    <!-- Weather Forecast -->
    <div class="card">
        <h2>Today's Weather - Suva</h2>

        <div class="weather-box">
            <p><strong>Condition:</strong> Partly Cloudy ☁️</p>
            <p><strong>Temperature:</strong> 28°C</p>
            <p><strong>Humidity:</strong> 80%</p>
            <p><strong>Wind:</strong> 18 km/h</p>
        </div>
    </div>

</div>

<script>
/*
    Calculate how many bus rides the student can afford.
    Each ride costs FJD 1.50.

    Validation:
    - Shows a red error if the input is empty.
    - Shows a red error if the input is negative.
    - Displays the result in blue for valid input.
*/
function calculateRides() {

    // Get the input field
    const budgetInput = document.getElementById("budget");

    // Convert input to a number
    const budget = parseFloat(budgetInput.value);

    // Result area
    const result = document.getElementById("result");

    // Check for empty input
    if (budgetInput.value.trim() === "") {
        result.style.color = "red";
        result.innerHTML = "Please enter your bus fare budget.";
        return;
    }

    // Check for negative or invalid input
    if (isNaN(budget) || budget < 0) {
        result.style.color = "red";
        result.innerHTML = "Budget cannot be negative. Please enter a valid positive amount.";
        return;
    }

    // Cost of one bus ride
    const fare = 1.50;

    // Calculate the number of whole rides
    const rides = Math.floor(budget / fare);

    // Display the result
    result.style.color = "#0D47A1";
    result.innerHTML =
        `With FJD ${budget.toFixed(2)}, you can afford <strong>${rides}</strong> bus ride(s).`;
}
</script>

</body>
</html>
